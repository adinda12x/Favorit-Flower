<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Ulang Tahun - Lily of the Valley</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Elegan dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Partikel Cahaya Emas & Putih -->
    <div id="particles-container"></div>

    <div class="scene">
        <p class="instruction" id="instruction">Sentuh bunga Lily of the Valley untuk membuka kado ✨</p>

        <!-- Buket Bunga 3D Lily of the Valley -->
        <div class="flower-wrapper" id="flowerTrigger">
            <div class="glow-aura"></div>
            
            <!-- Tangkai Melengkung -->
            <div class="stem"></div>
            
            <!-- Daun Biru-Emas Elegan -->
            <div class="leaf leaf-left"></div>
            <div class="leaf leaf-right"></div>

            <!-- Kuntum Bunga Lonceng 3D (Lily of the Valley) -->
            <div class="bell-flower bell-1">
                <div class="bell-body"></div>
                <div class="bell-rim"></div>
                <div class="stamen"></div>
            </div>

            <div class="bell-flower bell-2">
                <div class="bell-body"></div>
                <div class="bell-rim"></div>
                <div class="stamen"></div>
            </div>

            <div class="bell-flower bell-3">
                <div class="bell-body"></div>
                <div class="bell-rim"></div>
                <div class="stamen"></div>
            </div>

            <div class="bell-flower bell-4">
                <div class="bell-body"></div>
                <div class="bell-rim"></div>
                <div class="stamen"></div>
            </div>
        </div>

        <!-- Kartu Ucapan Elegan -->
        <div class="card" id="birthdayCard">
            <div class="gold-border">
                <span class="subtitle">A SPECIAL WISH FOR YOU</span>
                <h1>Selamat Ulang Tahun</h1>
                <p class="name">[Nama Penerima]</p>
                <div class="divider">✦</div>
                <p class="message">
                    Seperti <em>Lily of the Valley</em> yang melambangkan kembalinya kebahagiaan, 
                    semoga usiamu yang baru dipenuhi ketenangan, cahaya kebaikan, dan kemakmuran yang bersinar.
                </p>
                <button id="sparkleBtn">Taburkan Cahaya ✨</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
